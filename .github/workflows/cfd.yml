name: fs-cfd

# Runs the car CFD on GitHub-hosted runners (free for public repositories).
# Triggered by a push to the `cfd` branch whose commit message contains "[run]"; the cases come
# from run.json. A case may ask for up to 3 consecutive 6 h jobs ("stages": 1..3): an unfinished
# stage packs the decomposed case into a short-lived artifact (encrypted for private geometry) and
# the next stage resumes it. Final results are force-pushed as small orphan commits to res-<case>;
# live progress goes to st-<case>.
on:
  push:
    branches: [cfd]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # cancel superseded runs listed in run.json ("cancel_runs")

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run]') }}
    runs-on: ubuntu-24.04
    outputs:
      cases: ${{ steps.p.outputs.cases }}
      cases2: ${{ steps.p.outputs.cases2 }}
      cases3: ${{ steps.p.outputs.cases3 }}
      n2: ${{ steps.p.outputs.n2 }}
      n3: ${{ steps.p.outputs.n3 }}
    steps:
      - uses: actions/checkout@v4
      - name: Cancel superseded runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(python3 -c "import json; print(' '.join(str(i) for i in json.load(open('run.json')).get('cancel_runs', [])))"); do
            echo "cancelling run $id"
            gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
          done
      - id: p
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("run.json"))["cases"]
          s2 = [x for x in c if int(x.get("stages", 1)) >= 2]
          s3 = [x for x in c if int(x.get("stages", 1)) >= 3]
          print("cases=" + json.dumps(c))
          print("cases2=" + json.dumps(s2 or [{"name": "none"}]))
          print("cases3=" + json.dumps(s3 or [{"name": "none"}]))
          print(f"n2={len(s2)}")
          print(f"n3={len(s3)}")
          EOF

  s1:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.plan.outputs.cases) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CAD_KEY: ${{ secrets.CAD_KEY }}
      CASE_JSON: ${{ toJson(matrix.case) }}
      BUDGET_MIN: "350"
      STAGE: "1"
    steps:
      - name: Start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -q numpy scipy pillow pyvista matplotlib
      - name: Install OpenFOAM
        if: ${{ !matrix.case.post_only_from && !matrix.case.geometry_only }}
        run: bash scripts/install_openfoam.sh
      - name: Run case (stage 1)
        run: |
          if [ -n "${{ matrix.case.post_only_from }}" ]; then
            bash scripts/post_only.sh "$CASE_JSON" && touch "results/${{ matrix.case.name }}/.final"
          else
            bash scripts/run_case.sh "${{ matrix.case.name }}" "$CASE_JSON"
          fi
      - id: st
        if: always()
        run: if [ -s "$RUNNER_TEMP/state/state.bin" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi
      - name: Keep state for the next stage
        if: ${{ always() && steps.st.outputs.has == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.case.name }}-1
          path: ${{ runner.temp }}/state/state.bin
          retention-days: 2
          compression-level: 0
      - name: Publish results
        if: always()
        run: bash scripts/publish_results.sh "${{ matrix.case.name }}" "${{ job.status }}" "${{ github.run_id }}" "${{ github.run_attempt }}"

  s2:
    needs: [plan, s1]
    if: ${{ always() && needs.plan.outputs.n2 != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.plan.outputs.cases2) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CAD_KEY: ${{ secrets.CAD_KEY }}
      CASE_JSON: ${{ toJson(matrix.case) }}
      BUDGET_MIN: "350"
      STAGE: "2"
    steps:
      - name: Start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: state-${{ matrix.case.name }}-1
          path: ${{ runner.temp }}/state
      - uses: actions/setup-python@v5
        if: ${{ steps.dl.outcome == 'success' }}
        with:
          python-version: "3.12"
      - name: Python packages
        if: ${{ steps.dl.outcome == 'success' }}
        run: pip install -q numpy scipy pillow pyvista matplotlib
      - name: Install OpenFOAM
        if: ${{ steps.dl.outcome == 'success' }}
        run: bash scripts/install_openfoam.sh
      - name: Run case (stage 2)
        if: ${{ steps.dl.outcome == 'success' }}
        run: bash scripts/run_case.sh "${{ matrix.case.name }}" "$CASE_JSON"
      - id: st
        if: always()
        run: if [ -s "$RUNNER_TEMP/state/state.bin" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi
      - name: Keep state for the next stage
        if: ${{ always() && steps.st.outputs.has == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.case.name }}-2
          path: ${{ runner.temp }}/state/state.bin
          retention-days: 2
          compression-level: 0
      - name: Publish results
        if: ${{ always() && steps.dl.outcome == 'success' }}
        run: bash scripts/publish_results.sh "${{ matrix.case.name }}" "${{ job.status }}" "${{ github.run_id }}" "${{ github.run_attempt }}"

  s3:
    needs: [plan, s2]
    if: ${{ always() && needs.plan.outputs.n3 != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.plan.outputs.cases3) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CAD_KEY: ${{ secrets.CAD_KEY }}
      CASE_JSON: ${{ toJson(matrix.case) }}
      BUDGET_MIN: "350"
      STAGE: "3"
    steps:
      - name: Start clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: state-${{ matrix.case.name }}-2
          path: ${{ runner.temp }}/state
      - uses: actions/setup-python@v5
        if: ${{ steps.dl.outcome == 'success' }}
        with:
          python-version: "3.12"
      - name: Python packages
        if: ${{ steps.dl.outcome == 'success' }}
        run: pip install -q numpy scipy pillow pyvista matplotlib
      - name: Install OpenFOAM
        if: ${{ steps.dl.outcome == 'success' }}
        run: bash scripts/install_openfoam.sh
      - name: Run case (stage 3, final)
        if: ${{ steps.dl.outcome == 'success' }}
        run: bash scripts/run_case.sh "${{ matrix.case.name }}" "$CASE_JSON"
      - name: Publish results
        if: ${{ always() && steps.dl.outcome == 'success' }}
        run: bash scripts/publish_results.sh "${{ matrix.case.name }}" "${{ job.status }}" "${{ github.run_id }}" "${{ github.run_attempt }}"
